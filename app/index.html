<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homebook</title>
<style>
:root{
  --paper:#F5F7F4; --panel:#FFFFFF; --ink:#1D2922; --muted:#5E6B63; --line:#DCE3DE;
  --saguaro:#2E5B47; --saguaro-2:#E3EDE7; --sky:#2F6F9F; --red:#B3261E; --amber:#9A6200; --amber-bg:#FFF3D6;
  --radius-s:6px; --radius-m:10px;
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.45}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-s);padding:.5rem .9rem}
button:hover{border-color:var(--saguaro)}
button.primary{background:var(--saguaro);border-color:var(--saguaro);color:#fff}
button.primary:hover{background:#244a39}
button.danger{color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select{border:1px solid var(--line);border-radius:var(--radius-s);padding:.45rem .55rem;background:#fff;min-width:0}
input:focus,select:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px #2F6F9F22}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
aside{background:var(--saguaro);color:#EAF2ED;padding:1.4rem 1rem;display:flex;flex-direction:column;gap:1.4rem;overflow:auto}
.brand{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;padding:0 .5rem}
.brand small{display:block;font-size:.8rem;font-weight:400;opacity:.75}
.side-h{font-size:.85rem;opacity:.75;padding:0 .5rem;margin-bottom:.3rem}
.acct,.nav a{display:flex;justify-content:space-between;gap:.5rem;padding:.55rem .6rem;border-radius:var(--radius-s);
  color:inherit;text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.acct:hover,.nav a:hover{background:#ffffff14}
.acct.on,.nav a.on{background:#ffffff26}
.acct .num{opacity:.9}
.side-add{background:none;border:1px dashed #ffffff55;color:#EAF2ED;width:100%;margin-top:.4rem}
.side-add:hover{border-color:#fff}
.side-h.grp{display:flex;justify-content:space-between;margin:.9rem 0 .2rem;font-weight:600;letter-spacing:.02em}
.side-h.grp:first-child{margin-top:.2rem}
.acct .num.neg,.side-h .num.neg{color:#FFC9C2}
.save-state{margin-top:auto;font-size:.85rem;padding:.7rem;border-radius:var(--radius-s);background:#0000001f}
.save-state b{display:block}
.save-state button{margin-top:.5rem;width:100%;background:#fff;color:var(--saguaro);border:0;font-weight:600}

main{overflow:auto;padding:1.6rem 2rem 3rem}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}
h1{font-size:1.7rem;margin:0;letter-spacing:-.015em}
h2{font-size:1.15rem;margin:0 0 .8rem}
.sub{color:var(--muted);margin:.2rem 0 0}
.balance-strip{display:flex;gap:2.4rem;align-items:flex-end}
.bal-main{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.bal-lbl{font-size:.85rem;color:var(--muted)}
.bal-2{font-size:1.2rem;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.toolbar .grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m)}
.pad{padding:1.1rem 1.2rem}

table{width:100%;border-collapse:collapse}
th{font-size:.82rem;font-weight:600;color:var(--muted);text-align:left;padding:.6rem .6rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
td{padding:.55rem .6rem;border-bottom:1px solid #EEF2EF;vertical-align:middle}
tbody tr.tx:hover{background:#F3F7F5;cursor:pointer}
td.pay{font-weight:600}
td.pay small{display:block;font-weight:400;color:var(--muted)}
.cat-pill{display:inline-block;font-size:.82rem;padding:.12rem .5rem;border-radius:99px;background:var(--saguaro-2);color:var(--saguaro)}
.cat-pill.none{background:var(--amber-bg);color:var(--amber)}
.in{color:var(--saguaro);font-weight:600}
.neg{color:var(--red)}
.clr{width:2.2rem;text-align:center}
.clr button{width:1.8rem;height:1.8rem;padding:0;border-radius:50%;font-size:.8rem;font-weight:700;color:var(--muted)}
.clr button.c{background:var(--saguaro-2);border-color:var(--saguaro);color:var(--saguaro)}
.clr button.r{background:var(--saguaro);border-color:var(--saguaro);color:#fff}
tr.newrow td{background:#FAFCFB;border-bottom:2px solid var(--line)}
tr.newrow input,tr.newrow select{width:100%}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:.3rem}

dialog{border:0;border-radius:var(--radius-m);padding:0;width:min(560px,94vw);box-shadow:0 20px 60px #1d29223a}
dialog.wide{width:min(1000px,96vw)}
dialog::backdrop{background:#1d292266}
.dlg-h{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{margin:0}
.dlg-b{padding:1.2rem 1.3rem;max-height:70vh;overflow:auto}
.dlg-f{padding:.9rem 1.3rem;border-top:1px solid var(--line);display:flex;gap:.6rem;justify-content:flex-end;align-items:center}
.dlg-f .grow{flex:1}
.x{border:0;background:none;font-size:1.4rem;line-height:1;padding:.2rem .5rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.form label{display:flex;flex-direction:column;gap:.25rem;font-size:.88rem;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{border:0;border-radius:0;padding:.45rem .9rem}
.seg button.on{background:var(--saguaro);color:#fff}
.note{font-size:.88rem;color:var(--muted)}
.warn{background:var(--amber-bg);color:#5b3b00;border-radius:var(--radius-s);padding:.6rem .8rem;font-size:.9rem}
.dup td{color:#8a958e}
.tag{font-size:.75rem;padding:.1rem .45rem;border-radius:99px;background:var(--amber-bg);color:var(--amber);margin-left:.4rem;font-weight:600}

.rec-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem}
.rec-sum div{background:var(--paper);border-radius:var(--radius-s);padding:.7rem .9rem}
.rec-sum b{display:block;font-size:1.25rem}
.rec-sum .ok b{color:var(--saguaro)}
.rec-sum .bad b{color:var(--red)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem;align-items:start}
.stat-row{display:flex;gap:2.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.85rem;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:.8rem;align-items:center;padding:.35rem 0}
.bar{height:14px;border-radius:7px;background:var(--saguaro-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--saguaro);border-radius:7px}
.list-row{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid #EEF2EF}
.pie-wrap{display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap}
.pie-wrap svg{flex:0 0 auto}
.legend{flex:1;min-width:220px}
.lg{display:grid;grid-template-columns:14px 1fr auto 3.2rem;gap:.6rem;align-items:center;padding:.3rem 0;border-bottom:1px solid #EEF2EF;font-size:.95rem}
.sw{width:14px;height:14px;border-radius:4px}
.lg .pct{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.slice{transition:opacity .15s}
.pie-wrap svg:hover .slice{opacity:.55}.pie-wrap svg .slice:hover{opacity:1}
.chart-key{display:flex;gap:1.2rem;font-size:.88rem;color:var(--muted);margin-top:.4rem}
.chart-key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.4rem;vertical-align:-1px;background:var(--c)}
.due{font-size:.82rem;font-weight:600;padding:.12rem .5rem;border-radius:99px;white-space:nowrap}
.due.late{background:#FCE4E4;color:var(--red)}.due.soon{background:var(--amber-bg);color:var(--amber)}.due.ok{background:var(--saguaro-2);color:var(--saguaro)}
.upcoming{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem;padding:.7rem .9rem;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--radius-s)}
.upcoming .it{display:flex;gap:.5rem;align-items:center;padding:.2rem .6rem;background:var(--paper);border-radius:var(--radius-s)}
.upcoming button{padding:.25rem .6rem;font-size:.88rem}
.rec-group h2{margin-top:1.4rem}
.rec-group table{table-layout:fixed;min-width:900px}
.rec-group th:nth-child(1){width:22%}.rec-group th:nth-child(2){width:17%}.rec-group th:nth-child(3){width:13%}
.rec-group th:nth-child(4){width:11%}.rec-group th:nth-child(5){width:13%}.rec-group th:nth-child(6){width:12%}.rec-group th:nth-child(7){width:22%}
td.acts{white-space:nowrap;text-align:right}td.acts button{padding:.3rem .65rem;font-size:.88rem;margin-left:.3rem}
table.inv .ck{display:none}
.bud-row{display:grid;grid-template-columns:minmax(150px,1.2fr) 120px 2fr 110px 110px 32px;gap:.8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid #EEF2EF}
.bud-row.head{font-size:.82rem;font-weight:600;color:var(--muted);padding-top:0}
.bud-row .bar{height:16px;border-radius:8px}
.bud-row .bar i{transition:width .2s}
.bud-sub{padding-left:1.4rem;color:var(--muted)}
.bar{position:relative}.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6;text-decoration:none}
.bud-row input{width:100%;text-align:right}
.bud-row .rm{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:0}
.bud-row .rm:hover{color:var(--red)}
@media (max-width:820px){.bud-row{grid-template-columns:1fr 100px 90px 32px}.bud-row .bar,.bud-row .lft{display:none}}
.cat-edit{display:grid;grid-template-columns:1fr 150px auto;gap:.6rem;align-items:center;padding:.35rem 0}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:var(--radius-s);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;pointer-events:auto}
.toast button{margin-left:.9rem;background:none;border:1px solid #ffffff66;color:#fff;padding:.2rem .7rem;font-weight:600}
.toast button:hover{border-color:#fff}
.undo-side{margin-top:.5rem;width:100%;background:none!important;border:1px solid #ffffff55!important;color:#EAF2ED!important;font-weight:500!important}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}.grid2{grid-template-columns:1fr}main{padding:1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Homebook<small>Your money stays on this computer</small></div>
    <div>
      <div class="side-h">Accounts</div>
      <div id="acctList"></div>
      <button class="side-add" id="addAcctBtn">Add account</button>
    </div>
    <div class="nav">
      <div class="side-h">Views</div>
      <a data-view="register" class="on">Register</a>
      <a data-view="recurring">Recurring</a>
      <a data-view="budget">Budget</a>
      <a data-view="debt">Debt</a>
      <a data-view="reports">Spending</a>
      <a data-view="categories">Categories and rules</a>
      <a data-view="data">Save and backup</a>
    </div>
    <div class="save-state" id="saveState"></div>
  </aside>
  <main id="main"></main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<input type="file" id="fileImport" accept=".ofx,.qfx,.qif,.csv,.txt" hidden>
<input type="file" id="fileOpen" accept=".json,.homebook" hidden>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- data ---------- */
const DEFAULT_CATS=[["Groceries","spend"],["Dining out","spend"],["Coffee","spend"],["Gas","spend"],["Car payment","spend"],["Car maintenance","spend"],
["Rent or mortgage","spend"],["Utilities","spend"],["Phone and internet","spend"],["Insurance","spend"],["Medical","spend"],["Pharmacy","spend"],
["Household supplies","spend"],["Home repair","spend"],["Clothing","spend"],["Personal care","spend"],["Shopping","spend"],["Entertainment","spend"],
["Subscriptions","spend"],["Travel","spend"],["Travel: Flights","spend",5],["Travel: Hotels","spend",5],["Travel: Rental car","spend",5],["Travel: Food","spend",5],["Travel: Activities","spend",5],["Travel: Souvenirs","spend",5],["Pets","spend"],["Gifts","spend"],["Church and charity","spend"],["Education","spend"],["Hobbies","spend"],
["Fitness","spend"],["Bank fees and interest","spend"],["Taxes","spend"],["Cash withdrawal","spend"],["Other","spend"],
["Paycheck","income"],["Social Security or pension","income"],["Refund","income"],["Interest earned","income"],["Other income","income"],
["Transfer","transfer"],["Transfer to savings","transfer"],["Transfer from savings","transfer"],["Credit card payment","transfer"],["Loan payment","spend"],["Retirement savings","transfer"],["Savings","transfer"],["Investment contribution","transfer"],["Investment withdrawal","transfer"],["Market change","transfer"],["Dividends and interest","transfer"],["Loan interest","spend",6],["Escrow (taxes and insurance)","spend",6],["Loan principal","transfer",6]];
const PALETTE=["#1F77B4","#FF7F0E","#2CA02C","#D62728","#9467BD","#F2B701","#17BECF","#E377C2","#8C564B","#003F5C",
"#BCBD22","#7F7F7F","#00A86B","#FF1493","#4B0082","#A0522D","#6FA8DC","#808000","#FFB3A7","#2F4F4F","#B8860B","#C71585","#5F9EA0","#8B0000"];
let rankColors={};
const ACCT_TYPES={checking:"Checking",savings:"Savings",credit:"Credit card",cash:"Cash",
  roth:"Roth IRA",traditional:"Traditional IRA",k401:"401(k)",b403:"403(b)",brokerage:"Brokerage",hsa:"HSA",edu529:"529 college savings",invest:"Other investment",mortgage:"Mortgage",auto:"Auto loan",student:"Student loan",personal:"Personal loan",loan:"Loan"};
const INVEST=new Set(["roth","traditional","k401","b403","brokerage","hsa","edu529","invest"]);
const isInv=a=>a&&INVEST.has(a.type);
const LOAN=new Set(["mortgage","auto","student","personal","loan"]);
const isLoan=a=>a&&LOAN.has(a.type);
const isDebtType=t=>t==="credit"||LOAN.has(t);
const isDebt=a=>a&&isDebtType(a.type);
const acctOf=id=>S.accounts.find(a=>a.id===id);
const CATS_VERSION=6;
function ensureCats(){const v=S.catsVersion||1;if(v>=CATS_VERSION)return false;
  // only add categories introduced after this file's version, so ones she deleted don't come back
  for(const[name,kind,since]of DEFAULT_CATS){if((since||4)<=v&&v>=4)continue;
    if(!S.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){const par=parentOf(name);
      if(par&&!S.categories.some(c=>c.name===par))continue;
      const at=par?S.categories.map(c=>c.name===par||parentOf(c.name)===par).lastIndexOf(true)+1:S.categories.length;
      S.categories.splice(at,0,{name,kind})}}
  S.catsVersion=CATS_VERSION;return true}
const parentOf=n=>{n=String(n||"");const i=n.indexOf(": ");return i>0?n.slice(0,i):null};
const subOf=n=>{n=String(n||"");const i=n.indexOf(": ");return i>0?n.slice(i+2):n};
function renameCategory(old,nw){
  const map=new Map([[old,nw]]);S.categories.forEach(c=>{if(parentOf(c.name)===old)map.set(c.name,nw+": "+subOf(c.name))});
  for(const[o,n]of map){const c=S.categories.find(x=>x.name===o);if(c)c.name=n;
    S.txns.forEach(t=>{if(t.cat===o)t.cat=n});for(const k in S.payeeMap)if(S.payeeMap[k]===o)S.payeeMap[k]=n;
    (S.recurring||[]).forEach(r=>{if(r.cat===o)r.cat=n});(S.rules||[]).forEach(r=>{if(r.cat===o)r.cat=n});
    if(S.budgets&&o in S.budgets){S.budgets[n]=S.budgets[o];delete S.budgets[o]}
    if(S.budgetPer&&o in S.budgetPer){S.budgetPer[n]=S.budgetPer[o];delete S.budgetPer[o]}}}
function removeCategory(name){
  S.txns.forEach(t=>{if(t.cat===name)t.cat=""});(S.recurring||[]).forEach(r=>{if(r.cat===name)r.cat=""});
  (S.rules||[]).forEach(r=>{if(r.cat===name)r.cat=""});S.rules=(S.rules||[]).filter(r=>r.rename||r.cat);
  for(const k in S.payeeMap)if(S.payeeMap[k]===name)delete S.payeeMap[k];if(S.budgets)delete S.budgets[name];if(S.budgetPer)delete S.budgetPer[name];S.categories=S.categories.filter(c=>c.name!==name)}
const DESK=window.homebookDesktop||null;let appVersion="";
if(DESK&&DESK.refocus){ // Windows: restore typing after yes/no pop-ups
  const nativeConfirm=window.confirm.bind(window),nativeAlert=window.alert.bind(window);
  window.confirm=m=>{const r=nativeConfirm(m);DESK.refocus();return r};
  window.alert=m=>{nativeAlert(m);DESK.refocus()};
}let deskPath="",saveChain=Promise.resolve();
let S=null, view="register", curAcct=null, fileHandle=null, dirty=false, lastSaved=null, filterMonth="", search="";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function blank(){return{app:"homebook",version:1,catsVersion:6,recurring:[],rules:[],budgets:{},budgetPer:{},accounts:[],categories:DEFAULT_CATS.map(([name,kind])=>({name,kind})),txns:[],payeeMap:{}}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=c=>{const n=(c||0)/100;return(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
const toCents=v=>{if(v===""||v==null)return 0;const n=parseFloat(String(v).replace(/[$,\s]/g,"").replace(/^\((.*)\)$/,"-$1"));return isNaN(n)?0:Math.round(n*100)};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return`${+m}/${+dd}/${y}`};
const monthName=ym=>{const[y,m]=ym.split("-");return new Date(+y,+m-1,1).toLocaleString("en-US",{month:"long",year:"numeric"})};
function toast(t){const el=document.getElementById("toast");const canUndo=undoStack.length&&Date.now()-lastUndoPush<400; // only toasts fired right after a change offer Undo
  el.innerHTML="";el.append(document.createTextNode(t));
  if(canUndo){const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{el.classList.remove("show");undo()};el.append(b)}
  el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),canUndo?6000:2400)}
/* undo: every saved change keeps a copy of the state just before it */
let undoStack=[],prevJSON=null,lastUndoPush=0;const UNDO_MAX=30;
function snapshotBase(){prevJSON=JSON.stringify(S)}
let undoTick=false; // several saves during one action count as one undo step
function recordUndo(){const now=JSON.stringify(S);if(prevJSON&&prevJSON!==now){
    if(!undoTick){undoStack.push(prevJSON);if(undoStack.length>UNDO_MAX)undoStack.shift();undoTick=true;setTimeout(()=>undoTick=false,0)}
    lastUndoPush=Date.now()}
  prevJSON=now}
function undo(){if(!undoStack.length){toast("Nothing to undo");return}
  S=JSON.parse(undoStack.pop());prevJSON=JSON.stringify(S);lastUndoPush=0;
  if(!S.accounts.some(a=>a.id===curAcct))curAcct=S.accounts[0]?.id||null;
  dirty=true;if(DESK)deskSave();else{persistLocal();if(fileHandle)saveToFile(true)}
  if(dlg.open)dlg.close();render();const el=document.getElementById("toast");el.textContent="Undone";el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2000)}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"){
  const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;e.preventDefault();undo()}});
const catKind=n=>(S.categories.find(c=>c.name===n)||{}).kind;

/* ---------- storage: autosave in browser + real file on disk ---------- */
function persistLocal(){try{localStorage.setItem("homebook-data",JSON.stringify(S))}catch(e){}}
function markDirty(){recordUndo();dirty=true;if(DESK){deskSave();return}persistLocal();renderSaveState();if(fileHandle)saveToFile(true)}
function deskSave(){const text=JSON.stringify(S);renderSaveState();
  saveChain=saveChain.then(()=>DESK.save(text)).then(()=>{dirty=false;lastSaved=new Date();renderSaveState()})
    .catch(()=>{toast("Couldn't save. Check that the Documents folder is available.");renderSaveState()})}
function loadLocal(){try{const r=localStorage.getItem("homebook-data");if(r){const d=JSON.parse(r);if(d&&d.app==="homebook")return d}}catch(e){}return null}
const canFS="showSaveFilePicker" in window;
async function saveToFile(quiet){
  const data=JSON.stringify(S,null,1);
  try{
    if(canFS){

/* ---------- calculations ---------- */
const acctTx=id=>S.txns.filter(t=>t.acct===id);
function sorted(list){return[...list].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0))}
function balances(id){const a=S.accounts.find(x=>x.id===id);let bal=a?a.opening:0,clr=bal;
  for(const t of acctTx(id)){bal+=t.amt;if(t.status)clr+=t.amt}return{bal,clr}}
function findRule(text){const k=String(text||"").toLowerCase();if(!k)return null;
  return[...(S.rules||[])].filter(r=>r.match&&k.includes(r.match.toLowerCase())).sort((a,b)=>b.match.length-a.match.length)[0]||null}
function applyRule(t){const r=findRule(t.orig||t.payee);if(!r)return false;let ch=false;
  if(r.rename&&t.payee!==r.rename){if(!t.orig)t.orig=t.payee;t.payee=r.rename;ch=true}
  if(r.cat&&!t.cat){t.cat=r.cat;ch=true}return ch}
function suggestMatch(p){
  let s=String(p||"").toUpperCase(),prev;const pre=/^(POS|DEBIT|PURCHASE|CHECKCARD|CHECK CARD|ACH|SQ \*|TST\*|PAYPAL \*|SP \*|DDA|RECURRING|CARD)\s*[:*#]?\s*/;
  do{prev=s;s=s.replace(pre,"")}while(s!==prev);
  s=s.replace(/[#*]?\s*\d{2,}.*$/,"").replace(/\s+(AZ|PHX|PHOENIX|SCOTTSDALE|MESA|TEMPE)\b.*$/,"").trim();
  return(s.split(/\s+/).slice(0,2).join(" ")||String(p||"")).trim()}
function looksLikeBank(p){p=String(p||"");return p===p.toUpperCase()&&/[A-Z]/.test(p)||/[#*]|\d{3,}/.test(p)}
function cleanPayee(raw){ // turn "SQ *DUTCH BROS 4471 PHX AZ" into "Dutch Bros"
  raw=String(raw||"").trim();if(!raw||!looksLikeBank(raw))return raw;
  let s=raw.toUpperCase(),prev;const pre=/^(POS|DEBIT|PURCHASE|CHECKCARD|CHECK CARD|ACH|SQ \*|SQ\*|TST\*|TST \*|PAYPAL \*|PP\*|SP \*|SP\*|DDA|RECURRING|CARD|VISA|MC|DEBIT CARD|PREAUTHORIZED|WEB|ONLINE|PMT|PAYMENT TO|\d{3,4}(?=\s))\s*[:*#-]?\s*/;
  do{prev=s;s=s.replace(pre,"")}while(s!==prev);
  s=s.replace(/\*.*$/,"").replace(/#.*$/,"").replace(/\s+\d[\d\-\/ ]*.*$/,"").replace(/\.(COM|NET|ORG)\b.*$/,"")
     .replace(/\s+(AZ|CA|NV|UT|NM|TX|PHX|PHOENIX|SCOTTSDALE|MESA|TEMPE|CHANDLER|GILBERT|GLENDALE|PEORIA|TUCSON|US|USA)(\s.*)?$/,"").replace(/[\s.,-]+$/,"").trim();
  s=s.replace(/\s+(PMT|PAYMENT|AUTOPAY|AUTO PAY|BILL PAY|BILLPAY|ONLINE|WEB|RECURRING|PURCHASE)$/,"").replace(/[,\s]+(INC|LLC|CORP|CO|LTD)\.?$/,"").trim();
  if(s.length<2)return raw;
  const ALIAS=[[/^AMZN|^AMAZON/,"Amazon"],[/^WM SUPERCENTER|^WAL-?MART/,"Walmart"],[/^TGT\b|^TARGET/,"Target"],[/^SBUX|^STARBUCKS/,"Starbucks"],
    [/^FRYS/,"Fry's"],[/^MCDONALD/,"McDonald's"],[/^CVS/,"CVS Pharmacy"],[/^WALGREEN/,"Walgreens"],[/^CHICK-?FIL-?A/,"Chick-fil-A"],[/^QT\b|^QUIKTRIP/,"QuikTrip"],
    [/^HOME ?DEPOT|^THE HOME DEPOT/,"Home Depot"],[/^LOWES|^LOWE'S/,"Lowe's"],[/^COSTCO/,"Costco"],[/^SAFEWAY/,"Safeway"],[/^NETFLIX/,"Netflix"],[/^SPOTIFY/,"Spotify"]];
  for(const[re,name]of ALIAS)if(re.test(s))return name;
  const SMALL=new Set(["THE","AND","OF","FOR","A"]);
  return s.split(/\s+/).map((w,i)=>w.split("/").map(part=>part.length<=3&&!(i>0&&SMALL.has(part))?part:part.charAt(0)+part.slice(1).toLowerCase()).join("/")).join(" ")}
function autoRuleFrom(t,newPayee,cat){ // she renamed or categorized an imported item: remember it for next time
  if(!t.orig)return 0;const match=suggestMatch(t.orig);if(!match||match.length<3)return 0;
  const GENERIC=/^(CHECK|CHK|DEPOSIT|MOBILE DEPOSIT|TRANSFER|ONLINE TRANSFER|WITHDRAWAL|ATM|ACH|PAYMENT|ZELLE|VENMO|CASH APP|INTEREST|FEE|SERVICE FEE|DIVIDEND|CONTRIBUTION|REFUND|CREDIT|DEBIT|BILL|POS|TRANSFER FROM|TRANSFER TO|ZELLE TO|ZELLE FROM)$/i;
  if(GENERIC.test(match.trim()))return 0;
  let r=(S.rules||[]).find(x=>x.match.toLowerCase()===match.toLowerCase());
  if(!r){r={id:uid(),match,rename:"",cat:"",auto:true};S.rules.push(r)}
  if(newPayee)r.rename=newPayee;if(cat)r.cat=cat;
  let n=0;const k=match.toLowerCase();
  for(const x of S.txns)if(x!==t&&x.orig&&x.orig.toLowerCase().includes(k)){
    let ch=false;if(r.rename&&x.payee!==r.rename){x.payee=r.rename;ch=true}if(r.cat&&!x.cat){x.cat=r.cat;ch=true}if(ch)n++}
  return n}
function learnPayee(p,c){if(p&&c)S.payeeMap[p.trim().toLowerCase()]=c}
function guessCat(p){if(!p)return"";const k=p.trim().toLowerCase();if(S.payeeMap[k])return S.payeeMap[k];
  for(const key in S.payeeMap){if(key.length>3&&(k.includes(key)||key.includes(k)))return S.payeeMap[key]}return""}
let seqN=0;const nextSeq=()=>Date.now()*10+(seqN++%10);

function catInput(attrs,val){return`<input ${attrs} class="catin" list="catlist" value="${esc(val||"")}" placeholder="Type to search" autocomplete="off" spellcheck="false">`}
function resolveCat(v){v=String(v||"").trim().toLowerCase();if(!v)return"";const names=S.categories.map(c=>c.name);
  const exact=names.find(n=>n.toLowerCase()===v);if(exact)return exact;
  const starts=names.filter(n=>n.toLowerCase().startsWith(v));if(starts.length===1)return starts[0];
  const has=names.filter(n=>n.toLowerCase().includes(v));if(has.length===1)return has[0];return null}
function catMatches(v){v=String(v||"").trim().toLowerCase();return S.categories.filter(c=>c.name.toLowerCase().includes(v)).length}

  if(confirm(`"${name}" isn't a category yet. Add it as a new spending category?`)){S.categories.push({name,kind:"spend"});refreshCatList();markDirty();el.value=name;return true}
  el.value="";return false}

}

/* ---------- recurring ---------- */
const FREQS={weekly:"Every week",biweekly:"Every 2 weeks",monthly:"Every month",quarterly:"Every 3 months",yearly:"Every year"};
const PER_MONTH={weekly:52/12,biweekly:26/12,monthly:1,quarterly:1/3,yearly:1/12};
function addMonths(iso,n,day){const[y,m]=iso.split("-").map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(day,last)).padStart(2,"0")}
function addDays(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function advance(r){const day=r.day||+r.next.slice(8);
  r.next=r.freq==="weekly"?addDays(r.next,7):r.freq==="biweekly"?addDays(r.next,14):addMonths(r.next,r.freq==="quarterly"?3:r.freq==="yearly"?12:1,day)}
function enterRecurring(r,quiet){if(!r)return false;if(!S.accounts.some(a=>a.id===r.acct)){if(!quiet)toast("That payment's account no longer exists. Edit it first.");return false}
  const t={id:uid(),seq:nextSeq(),acct:r.acct,date:r.next,num:"",payee:r.payee,memo:r.memo||"",cat:r.cat||"",amt:r.amt,status:"",recId:r.id};S.txns.push(t);
  if(r.toAcct&&r.toAcct!==r.acct&&acctOf(r.toAcct))S.txns.push(makePartner(t,r.toAcct));
  return true;
  learnPayee(r.payee,r.cat);advance(r)}
function runAutoRecurring(){let n=0;const t=today();
  for(const r of S.recurring||[]){let guard=0;while(r.auto&&r.next<=t&&guard++<60){if(!enterRecurring(r,true))break;n++}}return n}
function daysUntil(iso){return Math.round((new Date(iso+"T12:00")-new Date(today()+"T12:00"))/864e5)}
function dueBadge(iso,incoming){const d=daysUntil(iso),n=x=>x===1?"1 day":x+" days";
  if(incoming){
    if(d<0)return`<span class="due late">Expected ${n(-d)} ago</span>`;
    if(d===0)return`<span class="due soon">Expected today</span>`;
    if(d<=7)return`<span class="due soon">Arrives in ${n(d)}</span>`;
    return`<span class="due ok">${fmtDate(iso)}</span>`}
  if(d<0)return`<span class="due late">${n(-d)} late</span>`;
  if(d===0)return`<span class="due soon">Due today</span>`;
  if(d<=7)return`<span class="due soon">Due in ${n(d)}</span>`;
  return`<span class="due ok">${fmtDate(iso)}</span>`}
function recGroup(r){if(r.amt>0)return"Money coming in";if(catKind(r.cat)==="transfer")return"Transfers and savings";if(r.cat==="Subscriptions")return"Subscriptions";return"Bills and payments"}
function upcomingStrip(acct){const list=(S.recurring||[]).filter(r=>r.acct===acct&&!r.auto&&daysUntil(r.next)<=7).sort((a,b)=>a.next<b.next?-1:1);
  if(!list.length)return"";
  return`<div class="upcoming"><b>Coming up</b>${list.map(r=>`<span class="it">${esc(r.payee)} <span class="num">${money(Math.abs(r.amt))}</span> ${dueBadge(r.next,r.amt>0)}<button data-up-enter="${r.id}">Enter</button></span>`).join("")}</div>`}
function renderRecurring(){
  const m=document.getElementById("main");const R=S.recurring||[];
  const monthlyOut=R.filter(r=>r.amt<0&&catKind(r.cat)!=="transfer").reduce((s,r)=>s-r.amt*PER_MONTH[r.freq],0);
  const monthlySubs=R.filter(r=>r.amt<0&&r.cat==="Subscriptions").reduce((s,r)=>s-r.amt*PER_MONTH[r.freq],0);
  const monthlyIn=R.filter(r=>r.amt>0).reduce((s,r)=>s+r.amt*PER_MONTH[r.freq],0);
  const groups=["Bills and payments","Subscriptions","Transfers and savings","Money coming in"];
  m.innerHTML=`<div class="head"><div><h1>Recurring</h1><p class="sub">Bills, subscriptions, transfers and paychecks that repeat.</p></div>
    <button class="primary" id="addRec">Add recurring payment</button></div>
  ${R.length?`<div class="stat-row">
    <div class="stat"><span>Bills and subscriptions, per month</span><b class="num" style="text-align:left">${money(Math.round(monthlyOut))}</b></div>
    <div class="stat"><span>Subscriptions alone</span><b class="num" style="text-align:left">${money(Math.round(monthlySubs))}</b></div>
    <div class="stat"><span>Regular money in, per month</span><b class="num in" style="text-align:left">${money(Math.round(monthlyIn))}</b></div>
    <div class="stat"><span>Subscriptions per year</span><b class="num" style="text-align:left">${money(Math.round(monthlySubs*12))}</b></div></div>`:""}
  ${R.length?groups.map(g=>{const list=R.filter(r=>recGroup(r)===g).sort((a,b)=>a.next<b.next?-1:1);if(!list.length)return"";
    return`<div class="rec-group"><h2>${g}</h2><div class="panel" style="overflow:auto"><table><thead><tr><th>Name</th><th>Category</th><th>How often</th><th class="num">Amount</th><th>Next</th><th>Entered</th><th></th></tr></thead><tbody>
    ${list.map(r=>`<tr><td class="pay">${esc(r.payee)}<small>${esc(S.accounts.find(a=>a.id===r.acct)?.name||"No account")}</small></td>
      <td>${r.cat?`<span class="cat-pill">${esc(r.cat)}</span>`:""}</td><td>${FREQS[r.freq]}</td>
      <td class="num ${r.amt>0?"in":""}">${money(Math.abs(r.amt))}</td><td>${dueBadge(r.next,r.amt>0)}</td>
      <td class="note">${r.auto?"Automatically":"When I click Enter"}</td>
      <td class="acts"><button data-enter="${r.id}">Enter now</button><button data-skip="${r.id}">Skip</button><button data-edit="${r.id}">Edit</button></td></tr>`).join("")}
    </tbody></table></div></div>`}).join(""):`<div class="panel empty"><b>No recurring payments yet</b>Add rent, utilities, phone, streaming services, paychecks, or a monthly transfer to savings.
      Homebook will remind you when they're due, or enter them for you.<br><br><button class="primary" id="addRec2">Add recurring payment</button></div>`}
  <p class="note" style="margin-top:1rem">Tip: open any transaction in the register and click Make this repeat.</p>`;
  const add=()=>recurringDialog();document.getElementById("addRec").onclick=add;const a2=document.getElementById("addRec2");if(a2)a2.onclick=add;
  m.querySelectorAll("[data-enter]").forEach(b=>b.onclick=()=>{enterRecurring(S.recurring.find(r=>r.id===b.dataset.enter));markDirty();render();toast("Entered in the register")});
  m.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>{const r=S.recurring.find(x=>x.id===b.dataset.skip);if(!confirm(`Skip ${r.payee} on ${fmtDate(r.next)}?`))return;advance(r);markDirty();render();toast("Skipped")});
  m.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>recurringDialog(S.recurring.find(r=>r.id===b.dataset.edit)));
}

/* ---------- investments and transfers ---------- */
function linkCats(A,B){ // categories for money moving from account A to account B
  if(isLoan(A)||isLoan(B))return["Loan principal","Loan principal"];
  const out=isInv(B)?"Investment contribution":B.type==="savings"?"Transfer to savings":B.type==="credit"?"Credit card payment":"Transfer";
  const inn=isInv(A)?"Investment withdrawal":A.type==="savings"?"Transfer from savings":isInv(B)?"Investment contribution":"Transfer";
  return[out,inn]}
function guessTarget(t){const others=S.accounts.filter(a=>a.id!==t.acct);if(!others.length)return null;const c=(t.cat||"").toLowerCase();
  const pick=f=>others.find(f);
  if(/invest|retire/.test(c))return pick(isInv)||others[0];
  if(/saving/.test(c))return pick(a=>a.type==="savings")||others[0];
  if(/credit card/.test(c))return pick(a=>a.type==="credit")||others[0];
  if(/loan/.test(c))return pick(isLoan)||others[0];
  return others[0]}
function makePartner(t,toId,xid){const A=acctOf(t.acct),B=acctOf(toId);
  const[outCat,inCat]=t.amt<0?linkCats(A,B):linkCats(B,A);
  const x=xid||uid();t.xfer=x;
  return{id:uid(),seq:nextSeq(),acct:toId,date:t.date,num:"",payee:(t.amt<0?"Transfer from ":"Transfer to ")+A.name,memo:t.memo||"",cat:t.amt<0?inCat:outCat,amt:-t.amt,status:"",xfer:x}}
function offerLink(t){
  if(t.xfer||catKind(t.cat)!=="transfer")return;
  const others=S.accounts.filter(a=>a.id!==t.acct);
  if(!others.length){toast("Tip: add your savings or investment account and transfers will show up there too.");return}
  const g=guessTarget(t),dir=t.amt<0?"to":"from";
  openDlg(`<div class="dlg-h"><h2>Record in the other account too?</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="dlg-b"><p style="margin-top:0">${money(Math.abs(t.amt))} moved ${dir} another account. Homebook can add the matching entry there so both balances stay right.</p>
  <div class="form"><label class="full">Money went ${dir}<select id="lTo">${others.map(a=>`<option value="${a.id}" ${a.id===g?.id?"selected":""}>${esc(a.name)} (${ACCT_TYPES[a.type]||""})</option>`).join("")}</select></label></div></div>
  <div class="dlg-f"><button data-close>Just this account</button><span class="grow"></span><button class="primary" id="lGo">Record in both</button></div>`);
  document.getElementById("lGo").onclick=()=>{const p=makePartner(t,document.getElementById("lTo").value);S.txns.push(p);
    dlg.close();markDirty();render();toast(`Also added to ${acctOf(p.acct).name}`)}}
function invStats(a){const y=today().slice(0,4),tx=acctTx(a.id).filter(t=>t.date.startsWith(y));
  const contrib=tx.filter(t=>t.amt>0&&t.cat!=="Market change"&&t.cat!=="Dividends and interest").reduce((s,t)=>s+t.amt,0);
  const growth=tx.filter(t=>t.cat==="Market change"||t.cat==="Dividends and interest").reduce((s,t)=>s+t.amt,0);
  return`<div><div class="bal-lbl">Contributed in ${y}</div><div class="bal-2 num">${money(contrib)}</div></div>
    <div><div class="bal-lbl">Growth in ${y}</div><div class="bal-2 num ${growth<0?"neg":"in"}">${growth>0?"+":""}${money(growth)}</div></div>`}
function valueDialog(a){const cur=balances(a.id).bal;
  openDlg(`<div class="dlg-h"><h2>Update ${esc(a.name)} value</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="dlg-b"><p class="note" style="margin-top:0">Look at your latest statement or log in to the account, and type the total value shown. Homebook records the difference as market change, so it doesn't count as a contribution.</p>
  <div class="form"><label>Value as of<input type="date" id="vDate" value="${today()}"></label>
  <label>Total value<input id="vAmt" class="num" inputmode="decimal" placeholder="${(cur/100).toFixed(2)}"></label></div>
  <p id="vDiff" class="note"></p></div>
  <div class="dlg-f"><button data-close>Cancel</button><button class="primary" id="vGo">Update</button></div>`);
  const $=id=>document.getElementById(id);
  $("vAmt").oninput=()=>{const d=toCents($("vAmt").value)-cur;$("vDiff").innerHTML=$("vAmt").value?`Change since last update: <b class="${d<0?"neg":"in"}">${d>0?"+":""}${money(d)}</b>`:""};

function monthYear(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return d.toLocaleString("en-US",{month:"short",year:"numeric"})}
function payoffPlan(a){const owed=-balances(a.id).bal;if(owed<=0)return{done:true};
  const pay=(a.pay||0)-(a.escrow||0);if(!(pay>0))return null;
  const r=(a.rate||0)/1200;let b=owed,m=0,interest=0;
  if(r>0&&pay<=Math.round(b*r))return{never:true};
  while(b>0&&m<1200){const i=Math.round(b*r);interest+=i;b=b+i-pay;m++}
  if(b>0)return{never:true};
  return{months:m,interest,when:monthYear(m),pay}}
function debtLine(a){const pl=payoffPlan(a);
  if(pl&&pl.done)return"";
  if(pl===null)return isLoan(a)?`<p class="note" style="margin:-.3rem 0 1rem">Add a monthly payment in Edit account to see a payoff date.</p>`:"";
  if(pl.never)return`<p class="note" style="margin:-.3rem 0 1rem;color:var(--red)">The monthly payment doesn't cover the interest, so this won't pay off.</p>`;
  return`<p class="note" style="margin:-.3rem 0 1rem">Paid off around <b>${pl.when}</b> at ${money(pl.pay)}/mo toward principal and interest. About ${money(pl.interest)} interest to go.</p>`}
function loanStats(a){const y=today().slice(0,4);
  const paid=acctTx(a.id).filter(t=>t.date.startsWith(y)&&t.amt>0).reduce((t,x)=>t+x.amt,0);

function dayDiff(a,b){return Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5)}

/* ---------- import ---------- */
function parseDate(s){s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return`${m[1]}-${m[2]}-${m[3]}`;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.'\s]*(\d{2,4})/)){let y=+m[3];if(y<100)y+=y<70?2000:1900;return`${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`}
  const d=new Date(s);if(!isNaN(d))return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return""}
function parseOFX(txt){const out=[];const re=/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi;let m;
  const tag=(b,n)=>{const r=b.match(new RegExp("<"+n+">([^<\\r\\n]*)","i"));return r?r[1].trim():""};
  while(m=re.exec(txt)){const b=m[1];const name=tag(b,"NAME")||tag(b,"PAYEE")||tag(b,"MEMO");
    out.push({date:parseDate(tag(b,"DTPOSTED")),amt:toCents(tag(b,"TRNAMT")),payee:decodeEnt(name),memo:tag(b,"NAME")?decodeEnt(tag(b,"MEMO")):"",num:tag(b,"CHECKNUM"),fitid:tag(b,"FITID")})}
  return out}
function parseOFXInvest(txt){ // investment statements: cash in/out, dividends, and total value
  const tag=(b,n)=>{const r=b.match(new RegExp("<"+n+">([^<\\r\\n]*)","i"));return r?r[1].trim():""};
  const items=parseOFX(txt).map(it=>({...it,payee:it.payee||(it.amt>0?"Contribution":"Withdrawal")}));
  const inc=[],re=/<(INCOME|REINVEST)>([\s\S]*?)<\/\1>/gi;let m;
  while(m=re.exec(txt)){const b=m[2],amt=Math.abs(toCents(tag(b,"TOTAL")));if(!amt)continue;
    const date=parseDate(tag(b,"DTSETTLE")||tag(b,"DTTRADE"));const type=(tag(b,"INCOMETYPE")||"DIV").toUpperCase();
    inc.push({kind:m[1].toUpperCase(),date,amt,fitid:tag(b,"FITID"),payee:type==="INTEREST"?"Interest":type.startsWith("CG")?"Capital gains distribution":"Dividend",
      memo:decodeEnt(tag(b,"MEMO")),num:"",cat:"Dividends and interest"})}
  for(const x of inc){if(x.kind==="REINVEST"&&inc.some(y=>y.kind==="INCOME"&&y.date===x.date&&y.amt===x.amt))continue;items.push(x)}
  const mk=[...txt.matchAll(/<MKTVAL>([^<\r\n]*)/gi)].map(r=>toCents(r[1]));
  const cash=toCents((txt.match(/<AVAILCASH>([^<\r\n]*)/i)||[])[1]||"0");
  const asof=parseDate(((txt.match(/<INVSTMTRS>[\s\S]*?<DTASOF>([^<\r\n]*)/i)||[])[1])||"")||today();
  return{items,value:mk.length?mk.reduce((a,b)=>a+b,0)+cash:null,asof}}
function decodeEnt(s){return s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&apos;/g,"'").replace(/&quot;/g,'"')}
function parseQIF(txt){const out=[];let cur={};
  for(const raw of txt.split(/\r?\n/)){const line=raw.trimEnd();if(!line||line.startsWith("!"))continue;const k=line[0],v=line.slice(1).trim();
    if(k==="^"){if(cur.date)out.push({date:cur.date,amt:cur.amt||0,payee:cur.payee||"(no payee)",memo:cur.memo||"",num:cur.num||"",cat:cur.cat||""});cur={};continue}
    if(k==="D")cur.date=parseDate(v.replace("'","/"));else if(k==="T"||k==="U")cur.amt=toCents(v);else if(k==="P")cur.payee=v;
    else if(k==="M")cur.memo=v;else if(k==="N")cur.num=/^\d+$/.test(v)?v:"";else if(k==="L"&&!v.startsWith("[")){const[a,b]=v.split(":");const full=b?a.trim()+": "+b.trim():a.trim();
      cur.cat=S.categories.some(c=>c.name.toLowerCase()===full.toLowerCase())?S.categories.find(c=>c.name.toLowerCase()===full.toLowerCase()).name:a.trim()}}
  return out}
function parseCSV(txt){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}

let IMP=null;
document.getElementById("fileImport").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  const txt=await f.text(),name=f.name.toLowerCase();let items;
  if(/<INVSTMTRS>/i.test(txt)){const r=parseOFXInvest(txt);if(!r.items.length&&r.value==null){toast("No transactions found in that file.");return}reviewImport(r.items,f.name,r);return}
  if(name.endsWith(".ofx")||name.endsWith(".qfx")||/<OFX>/i.test(txt))items=parseOFX(txt);
  else if(/^!Type:Invst/im.test(txt)){toast("Investment QIF files aren't supported. Download the OFX, QFX or CSV version instead.");return}
  else if(name.endsWith(".qif")||/^!Type:/im.test(txt))items=parseQIF(txt);
  else{const rows=parseCSV(txt);if(rows.length<2){toast("That file doesn't have any rows.");return}csvMapDialog(rows,f.name);return}
  if(!items.length){toast("No transactions found in that file.");return}
  reviewImport(items,f.name)};

function csvMapDialog(rows,fname){

  if(tgt&&isDebt(tgt)&&g.amt>=0&&!(g.out>=0&&g.inn>=0)){let pos=0,neg=0;for(const r of rows.slice(1)){const v=toCents(r[g.amt]);if(v>0)pos++;else if(v<0)neg++}autoFlip=pos>neg}
  const opts=sel=>`<option value="-1">Not in file</option>`+h.map((x,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(x||"Column "+(i+1))}</option>`).join("");
  openDlg(`<div class="dlg-h"><h2>Match the columns</h2><button class="x" data-close aria-label="Close">×</button></div>

function catColor(name){if(rankColors[name])return rankColors[name];const i=S.categories.findIndex(c=>c.name===name);return i<0?"#9AA5A0":PALETTE[i%PALETTE.length]}
function pieChart(cats,total){
  const R=90,r=54,cx=110,cy=110;let ang=-Math.PI/2;
  const pt=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  rankColors={};const items=cats.map(([k,v],i)=>{const c=PALETTE[i%PALETTE.length];rankColors[k]=c;return{k,v,c,p:v/total}});
  const paths=items.map(it=>{const a2=ang+it.p*Math.PI*2;let d;
    if(it.p>=.9999){d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`}
    else{const[x1,y1]=pt(ang,R),[x2,y2]=pt(a2,R),[x3,y3]=pt(a2,r),[x4,y4]=pt(ang,r),L=it.p>.5?1:0;
      d=`M${x1} ${y1}A${R} ${R} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${L} 0 ${x4} ${y4}Z`}
    ang=a2;return`<path class="slice" d="${d}" fill="${it.c}" stroke="#fff" stroke-width="2"><title>${esc(it.k)}: ${money(it.v)} (${Math.round(it.p*100)}%)</title></path>`}).join("");
  return`<div class="pie-wrap"><svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Spending by category">${paths}
    <text x="110" y="104" text-anchor="middle" font-size="12" fill="#5E6B63">Spent</text>
    <text x="110" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#1D2922">${money(total)}</text></svg>
    <div class="legend">${items.map(it=>`<div class="lg"><span class="sw" style="background:${it.c}"></span><span>${esc(it.k)}</span><span class="num">${money(it.v)}</span><span class="pct">${it.p<.005?"<1":Math.round(it.p*100)}%</span></div>`).join("")}</div></div>`}
function trendChart(ym,spent,got,inMonth){

  for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");const l=inMonth(k);ms.push({k,s:spent(l),g:got(l),lbl:d.toLocaleString("en-US",{month:"short"})})}

      <text x="${x0+w}" y="${H-4}" text-anchor="middle" font-size="12" fill="#5E6B63" ${x.k===ym?'font-weight="700"':""}>${x.lbl}</text>`}).join("");

    const k=catKind(t.cat);if(k==="transfer"||k==="income")continue;const c=t.cat||"";out[c]=(out[c]||0)-t.amt}
  return out}

    markDirty();renderBudget();toast(`${yr?"Yearly":"Monthly"} budget set for ${c}`)};
  $("bAdd").onclick=add;$("bAmt").onkeydown=e=>{if(e.key==="Enter")add()};
  const hint=()=>{const yr=$("bPer").value==="year",c=resolveCat($("bCat").value);$("bAmt").placeholder=yr?"Amount per year":"Amount per month";
    if(!c||$("bAmt").value)return;if(yr){const t=avgSpend(c,12)*12;if(t)$("bAmt").placeholder="Past 12 months: "+money(t)}else{const avg=avgSpend(c,3);if(avg)$("bAmt").placeholder="Averaged "+money(avg)}};
  $("bCat").addEventListener("change",hint);$("bPer").addEventListener("change",hint);hint();
  m.querySelectorAll("[data-b]").forEach(inp=>inp.onchange=()=>{const a=Math.abs(toCents(inp.value)),n=inp.dataset.b;
    if(!a){inp.value=(S.budgets[n]/100).toFixed(2);toast("Use × to remove a budget.");return}S.budgets[n]=a;markDirty();renderBudget()});
  m.querySelectorAll("[data-brm]").forEach(b=>b.onclick=()=>{delete S.budgets[b.dataset.brm];delete S.budgetPer[b.dataset.brm];markDirty();renderBudget();toast("Budget removed")});
  $("bSuggest").onclick=()=>{const cand=S.categories.filter(c=>c.kind==="spend"&&!parentOf(c.name)).map(c=>[c.name,avgSpend(c.name,3)]).filter(([n,v])=>v>=500&&!(n in S.budgets));
    if(!cand.length){toast("Not enough past spending to suggest from yet.");return}
    openDlg(`<div class="dlg-h"><h2>Suggested monthly budgets</h2><button class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-b"><p class="note" style="margin-top:0">Based on the average of the last 3 months, rounded up. Uncheck anything you don't want to track.</p>
      ${cand.map(([n,v],i)=>`<label style="display:flex;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid #EEF2EF"><input type="checkbox" data-sg="${i}" checked>
        <span style="flex:1">${esc(n)}</span><span class="num">${money(Math.ceil(v/1000)*1000)}</span></label>`).join("")}</div>
      <div class="dlg-f"><button data-close>Cancel</button><button class="primary" id="sgGo">Add these budgets</button></div>`);
    $("sgGo").onclick=()=>{let k=0;document.querySelectorAll("[data-sg]").forEach(cb=>{if(cb.checked){const[n,v]=cand[+cb.dataset.sg];S.budgets[n]=Math.ceil(v/1000)*1000;delete S.budgetPer[n];k++}});
      dlg.close();if(k){markDirty();renderBudget();toast(`Added ${k} ${k===1?"budget":"budgets"}`)}}};
}
function avgSpend(name,months){const now=today().slice(0,7);const[y,m]=now.split("-").map(Number);let tot=0;
  for(let i=1;i<=months;i++){const d=new Date(y,m-1-i,1);tot+=Math.max(0,spentFor(name,monthSpend(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))))}
  return Math.round(tot/months)}

/* ---------- categories ---------- */
function renderCategories(){
  const m=document.getElementById("main");
  const used={};S.txns.forEach(t=>used[t.cat]=(used[t.cat]||0)+1);
  const R=S.rules||[];
  m.innerHTML=`<div class="head"><div><h1>Categories and rules</h1><p class="sub">Renaming a category updates every transaction that uses it.</p></div></div>
  <div class="panel pad" style="max-width:900px;margin-bottom:1.2rem">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap"><h2 style="margin:0">Payee rules</h2>
      <span><button id="runRules">Clean up existing transactions</button> <button class="primary" id="addRule">Add rule</button></span></div>
    <label style="display:flex;gap:.5rem;align-items:center;margin:.8rem 0"><input type="checkbox" id="autoClean" ${S.autoClean!==false?"checked":""}> Clean up bank names automatically when importing, like <b>SQ *DUTCH BROS 4471 PHX AZ</b> → <b>Dutch Bros</b></label>
    <p class="note">You don't need to make rules yourself. When you rename or categorize an imported transaction, Homebook remembers it and does the same for matching transactions now and in future imports. Rules marked <i>automatic</i> were learned that way. You can still add or edit them here.</p>
    ${R.length?`<table><thead><tr><th>If the bank name contains</th><th>Rename to</th><th>Category</th><th></th></tr></thead><tbody>
      ${R.map(r=>`<tr><td><code>${esc(r.match)}</code>${r.auto?' <small class="note"><i>automatic</i></small>':""}</td><td>${esc(r.rename||"(keep bank name)")}</td><td>${r.cat?`<span class="cat-pill">${esc(r.cat)}</span>`:""}</td>
      <td class="acts"><button data-redit="${r.id}">Edit</button></td></tr>`).join("")}</tbody></table>`:`<p class="note"><i>No rules yet.</i></p>`}
  </div>
  <h2>Categories</h2>
  <div class="panel pad" style="max-width:720px">
    <div class="cat-edit"><input id="newCat" placeholder="New category name"><select id="newKind"><option value="spend">Spending</option><option value="income">Money in</option><option value="transfer">Transfer</option></select><button class="primary" id="addCat">Add</button></div>
    <p class="note" style="margin:.3rem 0 0">Use <b>+ Sub</b> to add subcategories, like Travel › Flights. Spending charts add subcategories into their main category unless you choose Show subcategories.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:.8rem 0">
    ${S.categories.filter(c=>!parentOf(c.name)).map(c=>{const kids=S.categories.filter(k=>parentOf(k.name)===c.name);
      return`<div class="cat-edit" style="grid-template-columns:1fr 150px auto auto"><input data-cn="${esc(c.name)}" value="${esc(c.name)}">
        <select data-ck="${esc(c.name)}"><option value="spend">Spending</option><option value="income">Money in</option><option value="transfer">Transfer</option></select>
        <button data-addsub="${esc(c.name)}">+ Sub</button><button class="danger" data-cdel="${esc(c.name)}" title="${used[c.name]||0} transactions use this">Remove</button></div>
      ${kids.map(k=>`<div class="cat-edit" style="grid-template-columns:1fr auto;padding-left:2rem"><span style="display:flex;gap:.5rem;align-items:center"><span class="note">↳</span><input data-sn="${esc(k.name)}" value="${esc(subOf(k.name))}" style="flex:1"></span>
        <button class="danger" data-cdel="${esc(k.name)}" title="${used[k.name]||0} transactions use this">Remove</button></div>`).join("")}`}).join("")}
  </div>`;
  S.categories.forEach(c=>{const el=document.querySelector(`[data-ck="${CSS.escape(c.name)}"]`);if(el)el.value=c.kind});
  document.getElementById("addRule").onclick=()=>ruleDialog();
  document.getElementById("autoClean").onchange=e=>{S.autoClean=e.target.checked;markDirty();toast(e.target.checked?"Bank names will be cleaned up":"Bank names will be kept as they are")};
  document.querySelectorAll("[data-redit]").forEach(b=>b.onclick=()=>ruleDialog(S.rules.find(r=>r.id===b.dataset.redit)));
  document.getElementById("runRules").onclick=()=>{let n=0;for(const t of S.txns){let ch=applyRule(t);
      if(!ch&&S.autoClean!==false&&!t.xfer){const raw=t.orig||t.payee,c=cleanPayee(raw);if(c!==t.payee&&c!==raw){if(!t.orig)t.orig=raw;t.payee=c;ch=true}}if(ch)n++}
    if(n){markDirty();renderCategories();toast(`Cleaned up ${n} ${n===1?"transaction":"transactions"}`)}else toast("No transactions matched your rules")};
  const nameOk=(n,except,isSub)=>{if(!n){toast("Enter a name.");return false}if(!isSub&&n.includes(":")){toast("Names can't contain a colon.");return false}
    if(S.categories.some(c=>c.name!==except&&c.name.toLowerCase()===n.toLowerCase())){toast("That category already exists.");return false}return true};
  document.getElementById("addCat").onclick=()=>{const n=document.getElementById("newCat").value.trim();if(!nameOk(n))return;
    S.categories.push({name:n,kind:document.getElementById("newKind").value});markDirty();renderCategories();toast("Category added")};
  document.querySelectorAll("[data-cn]").forEach(inp=>inp.onchange=()=>{const old=inp.dataset.cn,nw=inp.value.trim();
    if(nw===old)return;if(!nameOk(nw,old)){inp.value=old;return}renameCategory(old,nw);markDirty();renderCategories();toast("Renamed")});
  document.querySelectorAll("[data-sn]").forEach(inp=>inp.onchange=()=>{const old=inp.dataset.sn,par=parentOf(old),sub=inp.value.trim();
    if(sub===subOf(old))return;if(!sub||sub.includes(":")){inp.value=subOf(old);toast(sub?"Names can't contain a colon.":"Enter a name.");return}
    const nw=par+": "+sub;if(!nameOk(nw,old,true)){inp.value=subOf(old);return}renameCategory(old,nw);markDirty();renderCategories();toast("Renamed")});
  document.querySelectorAll("[data-ck]").forEach(sel=>sel.onchange=()=>{const n=sel.dataset.ck;
    S.categories.forEach(c=>{if(c.name===n||parentOf(c.name)===n)c.kind=sel.value});markDirty()});
  document.querySelectorAll("[data-addsub]").forEach(b=>b.onclick=()=>{const par=b.dataset.addsub;
    openDlg(`<div class="dlg-h"><h2>Add a subcategory to ${esc(par)}</h2><button class="x" data-close aria-label="Close">×</button></div>
      <div class="dlg-b"><div class="form"><label class="full">Subcategory name<input id="subName" placeholder="Flights"></label></div></div>
      <div class="dlg-f"><button data-close>Cancel</button><button class="primary" id="subGo">Add</button></div>`);
    const go=()=>{const sub=document.getElementById("subName").value.trim();if(!sub||sub.includes(":")){toast(sub?"Names can't contain a colon.":"Enter a name.");return}
      const nw=par+": "+sub;if(!nameOk(nw,null,true))return;const kind=(S.categories.find(c=>c.name===par)||{}).kind||"spend";
      const at=S.categories.map(c=>c.name===par||parentOf(c.name)===par).lastIndexOf(true)+1;S.categories.splice(at,0,{name:nw,kind});
      dlg.close();markDirty();renderCategories();toast(`Added ${par} › ${sub}`)};
    document.getElementById("subGo").onclick=go;document.getElementById("subName").onkeydown=e=>{if(e.key==="Enter")go()};document.getElementById("subName").focus()});
  document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{const name=b.dataset.cdel;
    const kids=S.categories.filter(c=>parentOf(c.name)===name);
    const n=S.txns.filter(t=>t.cat===name||kids.some(k=>k.name===t.cat)).length;
    const msg=kids.length?`Remove "${name}" and its ${kids.length} subcategories?${n?` ${n} transactions will become uncategorized.`:""}`:n?`${n} transactions use "${name}". They'll become uncategorized. Remove it?`:"";
    if(msg&&!confirm(msg))return;kids.forEach(k=>removeCategory(k.name));removeCategory(name);markDirty();renderCategories();toast("Removed")});
}

function ruleDialog(r,preset){const isNew=!r;const v=r||Object.assign({match:"",rename:"",cat:""},preset||{});
  openDlg(`<div class="dlg-h"><h2>${isNew?"Add payee rule":"Edit payee rule"}</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="dlg-b">${v.sample?`<p class="note" style="margin-top:0">Bank name: <b>${esc(v.sample)}</b></p>`:""}<div class="form">
    <label class="full">If the bank name contains<input id="rMatch" value="${esc(v.match)}" placeholder="DUTCH BROS"></label>
    <label>Rename it to<input id="rName" value="${esc(v.rename)}" placeholder="Dutch Bros"></label>
    <label>Category${catInput('id="rCat"',v.cat)}</label>
    <p class="note full" style="grid-column:1/-1;margin:0">Use a short piece that's always in the name, without store numbers or dates. Capital letters don't matter.</p>
    <p class="full" id="rPrev" style="grid-column:1/-1;margin:0"></p>
  </div></div>
  <div class="dlg-f">${isNew?"":`<button class="danger" id="rDel">Delete rule</button>`}<span class="grow"></span><button data-close>Cancel</button><button class="primary" id="rSave">${isNew?"Add rule":"Save"}</button></div>`);
  const $=id=>document.getElementById(id);
  const prev=()=>{const k=$("rMatch").value.trim().toLowerCase();const n=k?S.txns.filter(t=>(t.orig||t.payee).toLowerCase().includes(k)).length:0;
    $("rPrev").innerHTML=k?`<span class="note">Matches <b>${n}</b> existing ${n===1?"transaction":"transactions"}.</span>`:""};
  $("rMatch").oninput=prev;prev();
  $("rSave").onclick=()=>{const match=$("rMatch").value.trim();if(match.length<2){toast("Enter at least 2 letters to match.");return}
    const cat=readCat($("rCat"));if(cat===null)return;const rename=$("rName").value.trim();
    if(!rename&&!cat){toast("Add a new name, a category, or both.");return}
    const data={match,rename,cat};if(isNew)S.rules.push({id:uid(),...data});else Object.assign(r,data);
    let n=0;const k=match.toLowerCase();
    for(const t of S.txns)if((t.orig||t.payee).toLowerCase().includes(k)){
      if(rename&&t.payee!==rename){if(!t.orig)t.orig=t.payee;t.payee=rename;n++}
      if(cat&&!t.cat){t.cat=cat;n++}}
    dlg.close();markDirty();render();toast(n?"Rule saved and applied to existing transactions":"Rule saved")};
  const d=$("rDel");if(d)d.onclick=()=>{S.rules=S.rules.filter(x=>x.id!==r.id);dlg.close();markDirty();render();toast("Rule deleted")}}

/* ---------- data screen ---------- */
function renderData(){
  const m=document.getElementById("main");
  if(DESK){renderDataDesk(m);return}
  m.innerHTML=`<div class="head"><div><h1>Save and backup</h1><p class="sub">Homebook never sends your information anywhere. Everything lives in a file you control.</p></div></div>
  <div class="grid2">
  <div class="panel pad">
    <h2>Your Homebook file</h2>
    <p>${fileHandle?"Connected to a file on your computer. Changes save to it automatically.":canFS?"Pick a place on your computer to keep your Homebook file. After that, changes save automatically.":"Your browser saves by downloading a copy. Download a fresh copy after each session."}</p>
    <p class="note">${lastSaved?"Last saved "+lastSaved.toLocaleString():"Not saved to a file during this session."}</p>
    <div class="toolbar"><button class="primary" id="dSave">Save to file</button><button id="dOpen">Open a Homebook file</button><button id="dCopy">Download a backup copy</button></div>
    <p class="warn">Keep a backup somewhere other than this computer, like a USB drive or cloud folder. If this computer fails, the backup is the only copy.</p>
  </div>
  <div class="panel pad">
    <h2>Export</h2><p class="note">Download every transaction as a spreadsheet file that opens in Excel.</p>
    <button id="dCsv">Export to spreadsheet (CSV)</button>
    <h2 style="margin-top:1.6rem">Start over</h2><p class="note">Erases everything in this browser. Your saved files are not touched.</p>
    <button class="danger" id="dReset">Erase and start over</button>
  </div></div>`;
  document.getElementById("dSave").onclick=()=>saveToFile();
  document.getElementById("dOpen").onclick=openFile;
  document.getElementById("dCopy").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="Homebook backup "+today()+".json";a.click()};
  document.getElementById("dCsv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const lines=[["Account","Date","Check #","Payee","Category","Memo","Amount","Status"].join(",")].concat(sorted(S.txns).map(t=>[q(S.accounts.find(a=>a.id===t.acct)?.name),t.date,q(t.num),q(t.payee),q(t.cat),q(t.memo),(t.amt/100).toFixed(2),t.status==="r"?"Reconciled":t.status==="c"?"Cleared":""].join(",")));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/csv"}));a.download="Homebook transactions "+today()+".csv";a.click()};
  document.getElementById("dReset").onclick=()=>{if(!confirm("Erase all accounts and transactions from this browser?"))return;S=blank();undoStack=[];fileHandle=null;curAcct=null;persistLocal();dirty=false;view="register";render()};
}

  <div class="grid2">
  <div class="panel pad">
    <h2>Where your data lives</h2>

    <p>Homebook also keeps a backup copy for each day you use it, the last 30 days, in the Backups folder inside it.</p>
    <p class="note">${lastSaved?"Last saved "+lastSaved.toLocaleString():"No changes yet this session."}</p>
    <div class="toolbar"><button class="primary" id="dFolder">Show my Homebook folder</button><button id="dRestore">Restore from a backup</button><button id="dCopy">Save a copy somewhere else</button></div>

  document.getElementById("dCopy").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="Homebook copy "+today()+".json";a.click()};

function exportCSV(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["Account","Date","Check #","Payee","Category","Memo","Amount","Status"].join(",")].concat(sorted(S.txns).map(t=>[q(S.accounts.find(a=>a.id===t.acct)?.name),t.date,q(t.num),q(t.payee),q(t.cat),q(t.memo),(t.amt/100).toFixed(2),t.status==="r"?"Reconciled":t.status==="c"?"Cleared":""].join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/csv"}));a.download="Homebook transactions "+today()+".csv";a.click()}
/* ---------- boot ---------- */
function render(){refreshCatList();renderSide();renderSaveState();
  ({register:renderRegister,recurring:renderRecurring,budget:renderBudget,debt:renderDebt,reports:renderReports,categories:renderCategories,data:renderData})[view]()}
(async()=>{
  if(DESK){deskPath=await DESK.where();try{appVersion=await DESK.version()}catch(e){}let t=null;try{t=await DESK.load()}catch(e){}
    try{const d=t&&JSON.parse(t);S=d&&d.app==="homebook"?d:blank()}catch(e){S=blank();toast("Your Homebook file couldn't be read. Use Restore from a backup.")}
    S.payeeMap=S.payeeMap||{};}
  else S=loadLocal()||blank();
  S.recurring=S.recurring||[];S.budgets=S.budgets||{};S.budgetPer=S.budgetPer||{};
  const changed=ensureCats(),auto=runAutoRecurring();
  S.rules=S.rules||[];
  if(changed||auto){if(DESK)deskSave();else persistLocal()}
  snapshotBase();
  if(auto)setTimeout(()=>toast(`Entered ${auto} scheduled ${auto===1?"payment":"payments"}`),400);
  curAcct=S.accounts[0]?.id||null;render();
  setInterval(()=>{const n=runAutoRecurring();if(n){markDirty();render();toast(`Entered ${n} scheduled ${n===1?"payment":"payments"}`)}},60*60*1000);})();
</script>
