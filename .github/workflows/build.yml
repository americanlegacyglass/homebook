name: Build installers

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as an update (Windows computers update automatically)"
        type: boolean
        default: false

permissions:
  contents: write

# If you upload several files in a row, only the newest test build keeps running.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.release && 'release' || 'test' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install

      - name: Create version tag
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "::error::Version $VERSION was already released. Raise the version in package.json, then run again."
            exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win --publish ${{ inputs.release && 'always' || 'never' }} -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release stays a hidden draft until every file is uploaded, so a failed run can never break updates.
      - name: Make the release public
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Files in dist:"; ls -la dist
          ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
          echo "Files on the release:"; echo "$ASSETS"
          if ! echo "$ASSETS" | grep -qx "latest.yml"; then
            if [ -f dist/latest.yml ]; then
              echo "latest.yml was built but not uploaded. Uploading it now."
              gh release upload "v$VERSION" dist/latest.yml --clobber
              ASSETS=$(gh release view "v$VERSION" --json assets --jq '.assets[].name')
            fi
          fi
          echo "$ASSETS" | grep -qx "latest.yml" || { echo "::error::latest.yml is missing (it was never built). The release was left as a draft."; exit 1; }
          echo "$ASSETS" | grep -q "\.exe$" || { echo "::error::The installer was not uploaded. The release was left as a draft."; exit 1; }
          gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mac installer
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: Homebook-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
