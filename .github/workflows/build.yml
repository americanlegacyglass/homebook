name: Build installers

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as an update (Windows computers update automatically)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install

      - name: Create version tag
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "::error::Version $VERSION was already released. Raise the version in package.json, then run again."
            exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win --publish ${{ inputs.release && 'always' || 'never' }} -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Mac installer
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: Homebook-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
