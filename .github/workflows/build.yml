name: Build installers

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as an update (Windows computers update automatically)"
        type: boolean
        default: false

permissions:
  contents: write

# If you upload several files in a row, only the newest test build keeps running.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.release && 'release' || 'test' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install

      # Stop before building if a code file is broken (for example, the wrong text pasted into it).
      - name: Check code files
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "const s=require('fs').readFileSync('app/index.html','utf8');if(!s.startsWith('<!DOCTYPE html>'))throw new Error('app/index.html is not the Homebook app file');require('vm').createScript(s.split('<script>')[1].split('</script>')[0])"
          echo "All code files look valid."

      - name: Create version tag
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "::error::Version $VERSION was already released. Raise the version in package.json, then run again."
            exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: npx electron-builder --win --publish never -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}

      # Upload the three update files ourselves, all at once, then make the release public.
      - name: Publish the update
        if: runner.os == 'Windows' && inputs.release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXE="dist/Homebook-Setup-$VERSION.exe"
          echo "Files in dist:"; ls -la dist
          for f in "$EXE" "$EXE.blockmap" dist/latest.yml; do
            [ -f "$f" ] || { echo "::error::Missing $f, nothing was published."; exit 1; }
          done
          grep -q "Homebook-Setup-$VERSION.exe" dist/latest.yml || { echo "::error::latest.yml doesn't point to the installer, nothing was published."; exit 1; }
          gh release create "v$VERSION" "$EXE" "$EXE.blockmap" dist/latest.yml \
            --title "Homebook $VERSION" --notes "Homebook version $VERSION" --latest
          echo "Published. Files on the release:"
          gh release view "v$VERSION" --json assets --jq '.assets[].name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Homebook-${{ runner.os }}
          path: dist/*.exe
          if-no-files-found: error
